<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e6007e"><title>Cri Sublimado</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f3f7;font:16px Arial,sans-serif;color:#222}
header{background:#fff;padding:18px 16px 12px;text-align:center;border-bottom:4px solid #e6007e}
h1{margin:0;color:#e6007e;font-size:26px}.sub{margin:6px 0 14px;color:#666;font-size:14px}
nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
nav button{border:0;border-radius:10px;padding:13px 28px;font-weight:bold;font-size:16px;background:#e4e5ea;color:#333}
nav button.active{background:#e6007e;color:white}
main{padding:12px;max-width:1400px;margin:auto}.app{display:none;background:#fff;border-radius:12px;overflow:hidden;min-height:80vh}.app.active{display:block}
iframe{display:block;width:100%;height:calc(100vh - 150px);min-height:650px;border:0;background:#f4f5f8}
@media(max-width:600px){header{padding:13px 8px 10px}h1{font-size:22px}nav button{flex:1;padding:12px 8px}main{padding:6px}.app{border-radius:8px}iframe{height:calc(100vh - 140px);min-height:700px}}
</style></head><body>
<header><h1>CRI SUBLIMADO</h1><p class="sub">Tu taller de diseño e impresión</p><nav><button id="tabPines" class="active" type="button">PINES</button><button id="tabCintas" type="button">CINTAS</button><button id="tabVentas" type="button">VENTAS</button></nav></header>
<main><section id="pines" class="app active"><iframe title="Preparador de Pines" src="pines.html"></iframe></section><section id="cintas" class="app"><iframe title="Armador de Cintas" src="cintas.html"></iframe></section><section id="ventas" class="app"><iframe title="Ventas Cri Sublimado" src="ventas.html"></iframe></section></main>
<script>
const buttons={pines:document.getElementById('tabPines'),cintas:document.getElementById('tabCintas'),ventas:document.getElementById('tabVentas')};
function show(which){for(const k of ['pines','cintas','ventas']){document.getElementById(k).classList.toggle('active',k===which);buttons[k].classList.toggle('active',k===which)}try{localStorage.setItem('criSublimadoTab',which)}catch(e){}}
buttons.pines.onclick=()=>show('pines');buttons.cintas.onclick=()=>show('cintas');buttons.ventas.onclick=()=>show('ventas');
try{show(localStorage.getItem('criSublimadoTab')||'pines')}catch(e){show('pines')}
</script></body></html>
