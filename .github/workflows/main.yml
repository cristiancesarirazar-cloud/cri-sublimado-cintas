name: Construir APK Cri Sublimado

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android
        uses: android-actions/setup-android@v4

      - name: Instalar SDK de Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar firma estable de la aplicación
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode .github/keys/cri-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Construir APK
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Cri-Sublimado-Cintas-APK
          path: '**/build/outputs/apk/debug/*.apk'
